[package]
name = "c67-app"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = [
  "font-kit",
  "wayland",
  "x11",
] }
# Image decode for composer attachment thumbnails. Feature set stays inside
# what gpui already builds (no avif/rav1e encoders) so it adds no new deps.
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "gif",
  "webp",
  "bmp",
  "ico",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
smol = "2.0.2"
tungstenite = "0.30.0"

unicode-segmentation = "1"
ureq = { version = "3.5.2", features = ["json"] }
uuid = { version = "1.29.2", features = ["v4"] }
